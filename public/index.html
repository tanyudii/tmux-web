<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tmux-web</title>
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #1e1e1e;
        --panel: #252526;
        --border: #3c3c3c;
        --text: #d4d4d4;
        --accent: #0e639c;
        --danger: #a83232;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      button {
        font-family: inherit;
      }
      #login {
        margin: auto;
        padding: 2rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: min(360px, 90vw);
      }
      #login input {
        padding: 0.5rem;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 4px;
      }
      #login button,
      .sidebar button,
      .primary-button {
        padding: 0.5rem;
        background: var(--accent);
        border: none;
        color: white;
        border-radius: 4px;
        cursor: pointer;
      }
      #app {
        display: none;
        flex: 1;
        min-height: 0;
      }

      /* --- Project list view --- */
      #project-list-view {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 1.5rem;
        max-width: 720px;
        margin: 0 auto;
        width: 100%;
      }
      #project-list-view header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }
      .project-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 0.5rem;
        cursor: pointer;
      }
      .project-item:hover {
        border-color: var(--accent);
      }
      .project-item .project-name {
        font-weight: 600;
      }
      .project-item .project-path {
        color: #888;
        font-size: 0.85rem;
        font-family: monospace;
      }
      .project-item .kill {
        background: transparent;
        border: none;
        color: #999;
        cursor: pointer;
        font-size: 1.1rem;
        padding: 0 0.5rem;
      }
      .project-item .kill:hover {
        color: var(--danger);
      }
      #empty-projects {
        color: #777;
        padding: 2rem 0;
        text-align: center;
      }

      /* --- Project detail (sessions) view --- */
      #project-detail-view {
        display: none;
        flex: 1;
        min-height: 0;
      }
      .sidebar {
        width: 240px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 0.5rem;
        gap: 0.5rem;
        overflow-y: auto;
      }
      .sidebar h1 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #999;
        margin: 0.25rem 0;
      }
      .sidebar-top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #back-to-projects {
        background: transparent;
        border: none;
        color: var(--text);
        text-align: left;
        cursor: pointer;
        padding: 0.25rem 0;
      }
      #back-to-projects:hover {
        color: var(--accent);
      }
      #toggle-notify {
        background: transparent;
        border: none;
        color: var(--text);
        cursor: pointer;
        font-size: 1rem;
        padding: 0.25rem 0.4rem;
      }
      #toggle-notify:hover {
        color: var(--accent);
      }
      .session-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem;
        border-radius: 4px;
        cursor: pointer;
        gap: 0.5rem;
      }
      .session-item:hover {
        background: #2a2d2e;
      }
      .session-item.active {
        background: var(--accent);
      }
      .session-item .kill {
        background: transparent;
        border: none;
        color: #999;
        cursor: pointer;
        padding: 0 0.25rem;
      }
      .session-item .kill:hover {
        color: var(--danger);
      }
      #terminal-container {
        flex: 1;
        min-width: 0;
        padding: 0.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .terminal-row {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      #terminal {
        flex: 1;
        min-width: 0;
      }
      #empty-state {
        margin: auto;
        color: #777;
      }

      /* --- Environment bar (docker-compose setup, above the terminal) --- */
      .env-bar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0.6rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 0.85rem;
        flex-shrink: 0;
      }
      .env-info {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        overflow: hidden;
      }
      .env-status-badge {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        background: #3c3c3c;
        color: #ccc;
        flex-shrink: 0;
      }
      .env-status-badge.phase-starting,
      .env-status-badge.phase-stopping {
        background: #5a4a1a;
        color: #f0c96a;
      }
      .env-status-badge.phase-running {
        background: #1f4a2c;
        color: #8fd694;
      }
      .env-status-badge.phase-error {
        background: var(--danger);
        color: white;
      }
      #env-message {
        color: #999;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .env-actions {
        display: flex;
        gap: 0.4rem;
        flex-shrink: 0;
      }
      .env-action {
        padding: 0.3rem 0.6rem;
        background: var(--accent);
        border: none;
        color: white;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        text-decoration: none;
        white-space: nowrap;
      }
      .env-action-danger {
        background: var(--danger);
      }

      /* --- Changes sidebar (right) --- */
      #changes-sidebar {
        width: 320px;
        background: var(--panel);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: width 0.15s ease;
      }
      #changes-sidebar.collapsed {
        width: 36px;
      }
      #changes-sidebar.collapsed #changes-body {
        display: none;
      }
      .changes-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .changes-header h1 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #999;
        margin: 0;
        white-space: nowrap;
      }
      #changes-sidebar.collapsed .changes-header h1 {
        display: none;
      }
      #toggle-changes {
        background: transparent;
        border: none;
        color: var(--text);
        cursor: pointer;
        font-size: 1rem;
        padding: 0.25rem 0.4rem;
      }
      #toggle-changes:hover {
        color: var(--accent);
      }
      #changes-body {
        flex: 1;
        overflow-y: auto;
        padding: 0.5rem;
        font-size: 0.85rem;
      }
      .changes-group-title {
        font-size: 0.75rem;
        text-transform: uppercase;
        color: #888;
        margin: 0.75rem 0 0.25rem;
      }
      .changes-empty {
        color: #666;
        padding: 0.5rem 0;
      }
      .tree-folder,
      .tree-file {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.15rem 0.25rem;
        border-radius: 3px;
        cursor: pointer;
        white-space: nowrap;
      }
      .tree-folder:hover,
      .tree-file:hover {
        background: #2a2d2e;
      }
      .tree-file.status-added .status-badge {
        color: #4caf50;
      }
      .tree-file.status-modified .status-badge {
        color: #dcb04a;
      }
      .tree-file.status-deleted .status-badge {
        color: var(--danger);
      }
      .tree-file.status-untracked .status-badge {
        color: #4caf50;
      }
      .tree-file.status-renamed .status-badge {
        color: #4a9edc;
      }
      .status-badge {
        font-family: monospace;
        font-weight: 700;
        width: 1em;
        flex-shrink: 0;
      }
      .tree-children {
        margin-left: 1rem;
      }
      .diff-panel {
        margin: 0.25rem 0 0.5rem 1rem;
        border: 1px solid var(--border);
        border-radius: 4px;
        overflow-x: auto;
        background: var(--bg);
      }
      .diff-content {
        font-family: monospace;
        font-size: 0.78rem;
        white-space: pre;
        padding: 0.25rem 0;
      }
      .diff-line {
        padding: 0 0.5rem;
      }
      .diff-add {
        background: rgba(76, 175, 80, 0.15);
        color: #8fd694;
      }
      .diff-del {
        background: rgba(168, 50, 50, 0.15);
        color: #e08b8b;
      }
      .diff-hunk {
        color: #4a9edc;
      }
      .diff-file-header {
        color: #888;
      }
      .diff-context {
        color: var(--text);
      }
      .diff-note {
        padding: 0.4rem 0.5rem;
        color: #888;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <form id="login">
      <label for="token">Access token</label>
      <input id="token" type="password" autocomplete="off" placeholder="Paste your TMUX_WEB_TOKEN" />
      <button type="submit">Connect</button>
      <div id="login-error" style="color: var(--danger)"></div>
    </form>

    <div id="app">
      <div id="project-list-view">
        <header>
          <h1>Projects</h1>
          <button class="primary-button" id="add-project">+ Add project</button>
        </header>
        <div id="project-list"></div>
        <div id="empty-projects" style="display: none">
          No projects yet. Add one by pointing at a git repo on this server.
        </div>
      </div>

      <div id="project-detail-view">
        <div class="sidebar">
          <div class="sidebar-top-row">
            <button id="back-to-projects">&larr; Projects</button>
            <button id="toggle-notify" title="Toggle bell notifications">&#128276;</button>
          </div>
          <h1 id="project-detail-title"></h1>
          <div id="session-list"></div>
          <button id="new-session">+ New session</button>
        </div>
        <div id="terminal-container">
          <div id="env-bar" class="env-bar" style="display: none">
            <div class="env-info">
              <span id="env-status-badge" class="env-status-badge"></span>
              <span id="env-message"></span>
            </div>
            <div class="env-actions">
              <button id="env-setup-btn" class="env-action" style="display: none">Setup Environment</button>
              <button id="env-stop-btn" class="env-action env-action-danger" style="display: none">Stop</button>
              <a id="env-open-link" class="env-action" href="#" target="_blank" rel="noopener" style="display: none">Open &#8599;</a>
            </div>
          </div>
          <div class="terminal-row">
            <div id="terminal"></div>
            <div id="empty-state">Select or create a session to attach.</div>
          </div>
        </div>
        <div id="changes-sidebar">
          <div class="changes-header">
            <h1>Changes</h1>
            <button id="toggle-changes" title="Toggle changes panel">&hArr;</button>
          </div>
          <div id="changes-body"></div>
        </div>
      </div>
    </div>

    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
