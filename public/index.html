<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tmux-web</title>
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #1e1e1e;
        --panel: #252526;
        --border: #3c3c3c;
        --text: #d4d4d4;
        --accent: #0e639c;
        --danger: #a83232;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      #login {
        margin: auto;
        padding: 2rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: min(360px, 90vw);
      }
      #login input {
        padding: 0.5rem;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 4px;
      }
      #login button,
      .sidebar button {
        padding: 0.5rem;
        background: var(--accent);
        border: none;
        color: white;
        border-radius: 4px;
        cursor: pointer;
      }
      #app {
        display: none;
        flex: 1;
        min-height: 0;
      }
      .sidebar {
        width: 220px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 0.5rem;
        gap: 0.5rem;
        overflow-y: auto;
      }
      .sidebar h1 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #999;
        margin: 0.25rem 0;
      }
      .session-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem;
        border-radius: 4px;
        cursor: pointer;
        gap: 0.5rem;
      }
      .session-item:hover {
        background: #2a2d2e;
      }
      .session-item.active {
        background: var(--accent);
      }
      .session-item .kill {
        background: transparent;
        border: none;
        color: #999;
        cursor: pointer;
        padding: 0 0.25rem;
      }
      .session-item .kill:hover {
        color: var(--danger);
      }
      #terminal-container {
        flex: 1;
        min-width: 0;
        padding: 0.5rem;
        display: flex;
      }
      #terminal {
        flex: 1;
        min-width: 0;
      }
      #empty-state {
        margin: auto;
        color: #777;
      }
    </style>
  </head>
  <body>
    <form id="login">
      <label for="token">Access token</label>
      <input id="token" type="password" autocomplete="off" placeholder="Paste your TMUX_WEB_TOKEN" />
      <button type="submit">Connect</button>
      <div id="login-error" style="color: var(--danger)"></div>
    </form>

    <div id="app">
      <div class="sidebar">
        <h1>Sessions</h1>
        <div id="session-list"></div>
        <button id="new-session">+ New session</button>
      </div>
      <div id="terminal-container">
        <div id="terminal"></div>
        <div id="empty-state">Select or create a session to attach.</div>
      </div>
    </div>

    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
