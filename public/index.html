<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tmux-web</title>
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #1e1e1e;
        --panel: #252526;
        --border: #3c3c3c;
        --text: #d4d4d4;
        --accent: #0e639c;
        --danger: #a83232;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      button {
        font-family: inherit;
      }
      #login {
        margin: auto;
        padding: 2rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: min(360px, 90vw);
      }
      #login input {
        padding: 0.5rem;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 4px;
      }
      #login button,
      .sidebar button,
      .primary-button {
        padding: 0.5rem;
        background: var(--accent);
        border: none;
        color: white;
        border-radius: 4px;
        cursor: pointer;
      }
      #app {
        display: none;
        flex: 1;
        min-height: 0;
      }

      /* --- Project list view --- */
      #project-list-view {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 1.5rem;
        max-width: 720px;
        margin: 0 auto;
        width: 100%;
      }
      #project-list-view header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }
      .project-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 0.5rem;
        cursor: pointer;
      }
      .project-item:hover {
        border-color: var(--accent);
      }
      .project-item .project-name {
        font-weight: 600;
      }
      .project-item .project-path {
        color: #888;
        font-size: 0.85rem;
        font-family: monospace;
      }
      .project-item .kill {
        background: transparent;
        border: none;
        color: #999;
        cursor: pointer;
        font-size: 1.1rem;
        padding: 0 0.5rem;
      }
      .project-item .kill:hover {
        color: var(--danger);
      }
      #empty-projects {
        color: #777;
        padding: 2rem 0;
        text-align: center;
      }

      /* --- Project detail (sessions) view --- */
      #project-detail-view {
        display: none;
        flex: 1;
        min-height: 0;
      }
      .sidebar {
        width: 240px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 0.5rem;
        gap: 0.5rem;
        overflow-y: auto;
      }
      .sidebar h1 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #999;
        margin: 0.25rem 0;
      }
      #back-to-projects {
        background: transparent;
        border: none;
        color: var(--text);
        text-align: left;
        cursor: pointer;
        padding: 0.25rem 0;
      }
      #back-to-projects:hover {
        color: var(--accent);
      }
      .session-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem;
        border-radius: 4px;
        cursor: pointer;
        gap: 0.5rem;
      }
      .session-item:hover {
        background: #2a2d2e;
      }
      .session-item.active {
        background: var(--accent);
      }
      .session-item .kill {
        background: transparent;
        border: none;
        color: #999;
        cursor: pointer;
        padding: 0 0.25rem;
      }
      .session-item .kill:hover {
        color: var(--danger);
      }
      #terminal-container {
        flex: 1;
        min-width: 0;
        padding: 0.5rem;
        display: flex;
      }
      #terminal {
        flex: 1;
        min-width: 0;
      }
      #empty-state {
        margin: auto;
        color: #777;
      }
    </style>
  </head>
  <body>
    <form id="login">
      <label for="token">Access token</label>
      <input id="token" type="password" autocomplete="off" placeholder="Paste your TMUX_WEB_TOKEN" />
      <button type="submit">Connect</button>
      <div id="login-error" style="color: var(--danger)"></div>
    </form>

    <div id="app">
      <div id="project-list-view">
        <header>
          <h1>Projects</h1>
          <button class="primary-button" id="add-project">+ Add project</button>
        </header>
        <div id="project-list"></div>
        <div id="empty-projects" style="display: none">
          No projects yet. Add one by pointing at a git repo on this server.
        </div>
      </div>

      <div id="project-detail-view">
        <div class="sidebar">
          <button id="back-to-projects">&larr; Projects</button>
          <h1 id="project-detail-title"></h1>
          <div id="session-list"></div>
          <button id="new-session">+ New session</button>
        </div>
        <div id="terminal-container">
          <div id="terminal"></div>
          <div id="empty-state">Select or create a session to attach.</div>
        </div>
      </div>
    </div>

    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
