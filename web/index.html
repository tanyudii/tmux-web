<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover opts into drawing under iOS safe areas (notch/home
      indicator) instead of leaving them an unfilled OS-reserved strip.
      Ported from kmp/composeApp/src/wasmJsMain/resources/index.html.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10141c" />
    <!-- iOS Safari "Add to Home Screen" standalone presentation. These were
         a documented gap in the old KMP build (never added there) — added
         here since we're rewriting anyway. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="tmux-web" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>tmux-web</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
