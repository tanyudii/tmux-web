name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # tmux + node-pty's native addon (node-gyp) need these on the runner --
      # git is already preinstalled on ubuntu-latest.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux build-essential python3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
