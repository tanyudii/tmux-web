# Minimal starting point for .tmux-web-env/docker-compose.yml.
# Adjust service names, build context, ports, and env vars to match the
# actual project -- do not copy this verbatim.
#
# Deliberately omitted:
#   - top-level `name:`        -- tmux-web supplies `-p <projectId>__<sessionSlug>`
#   - per-service `container_name:` -- same reason, would collide across sessions

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      # host port is ephemeral and loopback-only; tmux-web resolves the
      # real published port via `docker compose port web 3000`
      - "127.0.0.1::3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/app
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "127.0.0.1::5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
