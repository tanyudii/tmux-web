org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.native.ignoreDisabledTargets=true
# Works around a Kotlin/Native compiler-cache linker failure on the CI macOS
# runner's Xcode 16.4 / iOS 18.5 SDK: `linkDebugTestIosSimulatorArm64` fails
# with "Undefined symbols ... _OBJC_CLASS_$_UIViewLayoutRegion" (referenced
# from Compose Multiplatform's ui-uikit-cache.a) because Skiko's precompiled
# K/N cache was built against a newer simulator SDK than the one the cached
# platform libs were linked against. This is the officially documented
# workaround (the linker error itself suggests it, see
# https://kotl.in/disable-native-cache) and matches known reports for the
# same undefined-ObjC-class-symbol failure class, e.g.
# https://github.com/JetBrains/compose-multiplatform/issues/4821 and
# https://github.com/getsentry/sentry-kotlin-multiplatform/issues/420.
# Scoped to iosSimulatorArm64 only -- that's the one target CI actually
# links/tests (see .github/workflows/kmp-ci.yml's "ios" job); iosArm64 isn't
# built there, so isn't touched here.
kotlin.native.cacheKind.iosSimulatorArm64=none
