name: iosApp
options:
  bundleIdPrefix: com.tanyudii
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.4

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - package: SwiftTerm
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: tmux-web
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        # Required by Compose Multiplatform's PlistSanityCheck (runs at
        # launch) — without it, ProMotion displays get throttled to 60Hz and
        # CMP intentionally crashes in debug to force this to be set.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tanyudii.tmuxweb
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "R4UMNB6KH2"
        CODE_SIGN_STYLE: Automatic
        # Framework produced by :composeApp:embedAndSignAppleFrameworkForXcode (run script phase below).
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # Xcode's default simulator ARCHS includes x86_64 (Intel Mac
        # compat), but this project only declares an iosSimulatorArm64()
        # Kotlin target (no iosX64()) -- a generic "iOS Simulator"
        # xcodebuild destination then tries to sync Compose resources for
        # x86_64 and fails with "Unknown iOS simulator arch: 'x86_64'"
        # (Compose Multiplatform's Gradle plugin has no matching KMP target
        # to resolve it against). Excluding it keeps the simulator build
        # arm64-only, matching the actual target list.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": "x86_64"
    preBuildScripts:
      - name: "Compile Kotlin Framework"
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
