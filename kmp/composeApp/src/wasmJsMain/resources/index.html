<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Without this, mobile/tablet browsers render at a desktop-width
         layout and zoom out instead of sizing to the device's actual
         viewport -- needed for the "auto-fit whatever device this runs
         on" requirement, not just the desktop scrollbar fix below.
         `viewport-fit=cover` opts into drawing under the iOS safe areas
         (notch/home-indicator) instead of leaving the OS reserve an
         unfilled strip there -- see the safe-area-inset padding below. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>tmux-web</title>
    <link rel="stylesheet" href="vendor/xterm.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            /* 100dvh (dynamic viewport height) tracks Safari's
               show/hide address bar and bottom toolbar on iOS; 100%
               (the old value) resolves against the layout viewport,
               which does NOT track that -- leaving a gap the height of
               whatever chrome Safari is currently showing. `height:
               100%` stays as a fallback for browsers without `dvh`
               support. */
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #0d1117;
        }
        body {
            /* border-box so the safe-area padding below is carved out of
               the 100dvh height already set above instead of adding to
               it -- with the default content-box, that padding would
               push body's total box taller than 100dvh and `overflow:
               hidden` would then clip that same amount off the bottom
               of #composeApp instead of fixing anything. */
            box-sizing: border-box;
            /* Fills the home-indicator safe area on notched/home-indicator
               iPhones and iPads instead of leaving it as a visible gap
               below the app's own background -- see viewport-fit=cover
               above, required for env() to resolve to anything nonzero.
               0 on devices without a safe area. */
            padding-bottom: env(safe-area-inset-bottom);
        }
        /* Compose mounts into this dedicated element (see main.kt), not
           into <body> directly -- without this anchor, the canvas's own
           measured size and body's size feed back into each other (body
           grows to fit the canvas, that growth triggers a scrollbar, the
           scrollbar shrinks the viewport, Compose re-measures smaller,
           repeat), which is what put both a horizontal and vertical
           browser scrollbar on screen even though nothing here needs to
           scroll. `overflow: hidden` above is only safe now that this
           element gives Compose a size anchored to the viewport instead
           of derived from its own content -- without this anchor,
           `overflow: hidden` alone would hide real UI, not just a
           rounding gap. */
        #composeApp {
            height: 100%;
        }
        /* xterm's own .xterm-viewport (vendor/xterm.css) keeps
           `overflow-y: scroll` always-on for its local scrollback buffer.
           Only the native scrollbar *chrome* is hidden here; overflow-y
           stays `scroll` so that local scrollback keeps working exactly
           as before -- most noticeable on macOS with "Show scroll bars:
           Always", which otherwise keeps a permanent gray track visible
           inside every terminal pane. */
        .xterm-viewport {
            scrollbar-width: none;
        }
        .xterm-viewport::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div id="composeApp"></div>
    <script>
      // iOS Safari does not shrink the layout viewport (what `height: 100%`
      // above resolves against) when the on-screen keyboard opens -- only
      // the *visual* viewport (window.visualViewport) shrinks to the area
      // actually visible above the keyboard. Without this, #composeApp
      // (and therefore the whole Compose canvas, including the terminal
      // pane) kept its full pre-keyboard height and the keyboard simply
      // painted over its bottom portion instead of the layout making room.
      // Driving #composeApp's height from visualViewport.height instead
      // makes the canvas genuinely shrink to the visible area, which
      // PlatformTerminalView.wasmJs.kt's existing ResizeObserver (see its
      // `attachResizeObserver` comment) already reacts to by re-fitting
      // xterm and reporting the new size to the PTY -- no Kotlin change
      // needed, this is purely "give Compose the right container size".
      //
      // visualViewport.offsetTop is compensated too: iOS can offset the
      // visual viewport from the layout viewport's origin (most commonly
      // from pinch-zoom, but iOS 26 has a documented bug -- WebKit#265578 --
      // where this can also happen transiently around keyboard show/hide),
      // and without the translateY here #composeApp would stay pinned to
      // the layout viewport's (0,0) while the actually-visible area shifted
      // out from under it.
      (function () {
        var appEl = document.getElementById("composeApp");
        function applyVisualViewportSize() {
          var vv = window.visualViewport;
          if (vv) {
            appEl.style.height = vv.height + "px";
            appEl.style.transform = vv.offsetTop ? "translateY(" + vv.offsetTop + "px)" : "";
          } else {
            appEl.style.height = window.innerHeight + "px";
            appEl.style.transform = "";
          }
        }
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", applyVisualViewportSize);
          window.visualViewport.addEventListener("scroll", applyVisualViewportSize);
        }
        window.addEventListener("resize", applyVisualViewportSize);
        applyVisualViewportSize();
      })();
    </script>
    <!-- UMD globals (Terminal, FitAddon) — same vendored assets as public/vendor/,
         loaded as plain scripts so wasmJsMain's XtermJs.kt externals resolve against
         globalThis with no npm/webpack module wiring. See Spike B (docs/adr/0002-*). -->
    <script src="vendor/xterm.js"></script>
    <script src="vendor/addon-fit.js"></script>
    <script>
      // Kotlin/Wasm's JS interop generates a runtime `instanceof <ExternalClassName>`
      // / `() => <ExternalClassName>` check for every `external class` (used for
      // nullable-type safe casts) -- it expects a global matching the Kotlin class's
      // *name*, not whatever name the underlying JS library actually exports.
      // XtermJs.kt's `external class XtermTerminal`/`XtermFitAddon` construct real
      // instances via `js("new Terminal(...)")`/`js("new FitAddon.FitAddon()")`, so
      // without these aliases the generated check throws
      // "XtermTerminal is not defined" the moment PlatformTerminalView.wasmJs.kt
      // mounts a terminal, and the whole screen fails silently (blank pane, no
      // rendered xterm rows).
      window.XtermTerminal = Terminal;
      window.XtermFitAddon = FitAddon.FitAddon;
    </script>
    <script src="composeApp.js"></script>
</body>
</html>
