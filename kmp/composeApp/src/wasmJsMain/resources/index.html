<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Without this, mobile/tablet browsers render at a desktop-width
         layout and zoom out instead of sizing to the device's actual
         viewport -- needed for the "auto-fit whatever device this runs
         on" requirement, not just the desktop scrollbar fix below. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tmux-web</title>
    <link rel="stylesheet" href="vendor/xterm.css">
    <style>
        /* Compose Multiplatform Web's own recommended reset
           (kotlinlang.org/docs/multiplatform/compose-css-styles.html):
           html/body need an explicit width AND height, not just height,
           or the canvas's own measured size and the body's size can feed
           back into each other -- body grows to fit the canvas, that
           growth causes a scrollbar, the scrollbar shrinks the viewport,
           Compose re-measures a smaller canvas, the scrollbar disappears,
           Compose grows the canvas back, repeat. That loop is what put
           both a horizontal AND vertical browser scrollbar on screen even
           though nothing in the app actually needs to scroll.
           `overflow: hidden` only became safe to add once `#composeApp`
           below gives the mounted canvas a size that's anchored to the
           viewport instead of derived from its own content -- without
           that anchor, `overflow: hidden` alone hides real UI instead of
           a rounding gap (that's what "cuts the app off" if this rule is
           copied without the matching #composeApp sizing). */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d1117;
        }
        /* Compose mounts into this dedicated element (see main.kt), not
           into <body> directly -- breaks the circular sizing dependency
           above, since #composeApp's size now comes from its CSS (100% of
           the already-fixed html/body box), not from measuring its own
           canvas child. */
        #composeApp {
            width: 100%;
            height: 100%;
        }
        /* xterm's own .xterm-viewport (vendor/xterm.css) deliberately
           keeps `overflow-y: scroll` always-on -- that's what backs the
           mouse-wheel-drives-tmux-copy-mode feature (see
           TerminalViewModel/PlatformTerminalView), not a bug. Only the
           native scrollbar *chrome* is hidden here; overflow-y stays
           `scroll` so wheel/scroll events keep firing exactly as before.
           Most noticeable on macOS with System Settings > Appearance >
           "Show scroll bars: Always", which otherwise keeps a permanent
           gray track visible inside every terminal pane. */
        .xterm-viewport {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .xterm-viewport::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div id="composeApp"></div>
    <!-- UMD globals (Terminal, FitAddon) — same vendored assets as public/vendor/,
         loaded as plain scripts so wasmJsMain's XtermJs.kt externals resolve against
         globalThis with no npm/webpack module wiring. See Spike B (docs/adr/0002-*). -->
    <script src="vendor/xterm.js"></script>
    <script src="vendor/addon-fit.js"></script>
    <script>
      // Kotlin/Wasm's JS interop generates a runtime `instanceof <ExternalClassName>`
      // / `() => <ExternalClassName>` check for every `external class` (used for
      // nullable-type safe casts) -- it expects a global matching the Kotlin class's
      // *name*, not whatever name the underlying JS library actually exports.
      // XtermJs.kt's `external class XtermTerminal`/`XtermFitAddon` construct real
      // instances via `js("new Terminal(...)")`/`js("new FitAddon.FitAddon()")`, so
      // without these aliases the generated check throws
      // "XtermTerminal is not defined" the moment PlatformTerminalView.wasmJs.kt
      // mounts a terminal, and the whole screen fails silently (blank pane, no
      // rendered xterm rows).
      window.XtermTerminal = Terminal;
      window.XtermFitAddon = FitAddon.FitAddon;
    </script>
    <script src="composeApp.js"></script>
</body>
</html>
