name: TmuxWebClient
options:
  bundleIdPrefix: com.tanyudii
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.4

targets:
  TmuxWebClient:
    type: application
    platform: iOS
    sources:
      - path: TmuxWebClient
    dependencies:
      - package: SwiftTerm
    info:
      path: TmuxWebClient/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tanyudii.tmuxwebclient
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

  TmuxWebClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TmuxWebClientTests
    dependencies:
      - target: TmuxWebClient
    settings:
      base:
        SWIFT_VERSION: "5.0"

schemes:
  TmuxWebClient:
    build:
      targets:
        TmuxWebClient: all
        TmuxWebClientTests: [test]
    test:
      targets:
        - TmuxWebClientTests
    run:
      config: Debug
